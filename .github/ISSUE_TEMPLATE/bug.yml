name: Bug
description: Bite crashed, hung, or printed something confusing
labels: [bug]
body:
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      placeholder: bite --free --last 20
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What Bite printed
      description: Paste the output. It shows as plain text.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: One or two sentences.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Your system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bite version
      description: What `bite --version` prints.
      placeholder: bite 1.0.8
  - type: input
    id: testcmd
    attributes:
      label: Python version and test command
      placeholder: Python 3.12, pytest -q
