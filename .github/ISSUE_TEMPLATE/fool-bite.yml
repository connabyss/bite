name: I fooled Bite
description: A Fool Bite entry, a commit that sneaks a "fix" past Bite
labels: [fool-bite]
body:
  - type: textarea
    id: repo
    attributes:
      label: The repo
      description: A link, or paste the files and the commit messages. A tiny made-up repo is best.
    validations:
      required: true
  - type: input
    id: claim
    attributes:
      label: What the trick commit claims
      description: Its commit message.
    validations:
      required: true
  - type: textarea
    id: said
    attributes:
      label: What Bite said
      description: Paste the line from `bite --free`.
      render: text
    validations:
      required: true
  - type: textarea
    id: honest
    attributes:
      label: The honest answer, and why
      placeholder: No test checks the rounding, but Bite says ✅
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Your Bite version, OS and test command
  - type: input
    id: credit
    attributes:
      label: How to credit you in TRICKS.md
      description: Your GitHub name is fine.
