# Dependabot (minor and patch updates are grouped and safe to auto-merge once the tests pass;
# major updates come in a separate "-major" PR to review by hand):
# It keeps the GitHub Actions this repo uses, and its Python packages, up to date.
# Quiet on purpose: once a week, and each kind's updates come together in one pull request.
# Security fixes (turned on in Settings > Code security) still come as soon as they're out.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"  # .github/workflows and the root action.yml
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:   # breaking versions come in their own PR: review it by hand, don't auto-merge
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: pip
    directory: "/"  # pyproject.toml
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:   # breaking versions come in their own PR: review it by hand, don't auto-merge
        patterns: ["*"]
        update-types: ["major"]
