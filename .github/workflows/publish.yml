name: publish

# Puts Bite on PyPI (pip install bite-check) when a GitHub release is published.
# No token: PyPI trusts this workflow directly (Trusted Publishing), set up once on pypi.org.
# The release-drafter workflow starts it by name on the new tag (workflow_dispatch) when it publishes a release
# by itself, since a release made by a workflow's token doesn't send the "published" event.

on:
  release:
    types: [published]
  workflow_dispatch:

# Read-only by default; only the publish job gets the one extra right PyPI needs (id-token).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the release tag matches the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$version" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bite-check
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
