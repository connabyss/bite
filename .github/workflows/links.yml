name: links

# Checks that every link in Bite's Markdown files still loads, so a broken link never reaches the README again.
# Runs on pull requests that change docs, once a week (pages elsewhere can move), and by hand.
on:
  pull_request:
    paths: ['**/*.md', '.github/ISSUE_TEMPLATE/**', '.github/workflows/links.yml', 'lychee.toml']
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Links into this repo's own main branch are checked against this checkout's files instead, so a pull
      # request that adds a page can link to it (main doesn't have it yet), and one that deletes a linked page
      # still fails.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --remap '^https://github\.com/connabyss/bite/(?:blob|tree)/main/([^#?]*)(?:[#?].*)?$ file://${{ github.workspace }}/$1'
            './**/*.md' '.github/ISSUE_TEMPLATE/*.yml' pyproject.toml
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
