[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bite-check"
version = "0.7.0"
description = "Checks whether the \"fixed\" in your coding agent's recent commits is actually true."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["testing", "ai", "coding-agent", "claude", "pytest", "regression", "git", "regression-testing", "claude-code", "coding-agents", "code-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
paid = ["claude-agent-sdk"]
test = ["pytest"]

[project.scripts]
bite = "recent:main"

[project.urls]
Homepage = "https://github.com/connabyss/bite"
Source = "https://github.com/connabyss/bite"
Issues = "https://github.com/connabyss/bite/issues"

[tool.setuptools]
py-modules = ["bite", "live", "recent", "repo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"
