<svg xmlns="http://www.w3.org/2000/svg" width="860" height="348" viewBox="0 0 860 348" role="img">
<title>bite --demo: one fix has a test that notices it, the other has none</title>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:14px;white-space:pre}</style>
<rect width="860" height="348" rx="10" fill="#0d1117"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text x="18" y="58" fill="#7ee787">$</text>
<text x="34.8" y="58" fill="#e6edf3" font-weight="bold" opacity="0">b<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0316;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="43.2" y="58" fill="#e6edf3" font-weight="bold" opacity="0">i<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0363;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="51.6" y="58" fill="#e6edf3" font-weight="bold" opacity="0">t<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0411;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="60.0" y="58" fill="#e6edf3" font-weight="bold" opacity="0">e<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0458;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="76.8" y="58" fill="#e6edf3" font-weight="bold" opacity="0">-<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0553;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="85.2" y="58" fill="#e6edf3" font-weight="bold" opacity="0">-<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0600;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="93.6" y="58" fill="#e6edf3" font-weight="bold" opacity="0">d<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0647;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="102.0" y="58" fill="#e6edf3" font-weight="bold" opacity="0">e<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0695;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="110.4" y="58" fill="#e6edf3" font-weight="bold" opacity="0">m<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0742;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="118.8" y="58" fill="#e6edf3" font-weight="bold" opacity="0">o<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0789;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<rect y="46" width="8.4" height="16" fill="#e6edf3" x="34.8"><animate attributeName="x" values="34.8;43.2;51.6;60.0;68.4;76.8;85.2;93.6;102.0;110.4;118.8;127.2" keyTimes="0.0000;0.0363;0.0411;0.0458;0.0505;0.0553;0.0600;0.0647;0.0695;0.0742;0.0789;0.0837" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1;0;1;0" keyTimes="0;0.0158;0.0316;0.0995;0.1153;0.1211" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></rect>
<text x="18" y="80" opacity="0" xml:space="preserve"><tspan fill="#8b949e">Two of its commits say they fixed something. One added a test for its fix, the other didn&#x27;t.</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0947;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="18" y="102" opacity="0" xml:space="preserve"><tspan fill="#8b949e">Bite takes each fix back out and runs the tests, to see whether any test notices it&#x27;s gone.</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1053;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="18" y="124" opacity="0" xml:space="preserve"><tspan fill="#8b949e">  free check of 2: each runs the tests twice (with and without the change)</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1211;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="18" y="146" opacity="0" xml:space="preserve"><tspan fill="#8b949e">  9661edcf </tspan><tspan fill="#7ee787" font-weight="bold">✅ noticed by test_discount_never_below_zero</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1684;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="18" y="168" opacity="0" xml:space="preserve"><tspan fill="#e6edf3">           Fix discounts over 100% making the price negative</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1684;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="18" y="190" opacity="0" xml:space="preserve"><tspan fill="#8b949e">  e5c329ec </tspan><tspan fill="#e3b341" font-weight="bold">⚠️ NO TEST NOTICED</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2105;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="18" y="212" opacity="0" xml:space="preserve"><tspan fill="#e6edf3">           Fix totals showing long decimals like 0.30000000000000004</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2105;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="18" y="256" opacity="0" xml:space="preserve"><tspan fill="#e3b341">No test noticed it was gone. If it breaks later, nothing warns you.</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2579;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="18" y="278" opacity="0" xml:space="preserve"><tspan fill="#e6edf3" font-weight="bold">Next: add a test that fails without it.</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2895;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
<text x="18" y="322" opacity="0" xml:space="preserve"><tspan fill="#8b949e">0s, $0.00</tspan><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3263;0.985" calcMode="discrete" dur="19.0s" repeatCount="indefinite"/></text>
