<svg xmlns="http://www.w3.org/2000/svg" width="860" height="348" viewBox="0 0 860 348" role="img">
<title>bite --demo: one fix has a test that notices it, the other has none</title>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:14px;white-space:pre}.l{opacity:0;animation:show 11.0s infinite}.d0{animation-delay:0s;animation-name:s0}@keyframes s0{0%,2.73%{opacity:0}3.23%,96%{opacity:1}100%{opacity:0}}.d1{animation-delay:0s;animation-name:s1}@keyframes s1{0%,10.91%{opacity:0}11.41%,96%{opacity:1}100%{opacity:0}}.d2{animation-delay:0s;animation-name:s2}@keyframes s2{0%,14.55%{opacity:0}15.05%,96%{opacity:1}100%{opacity:0}}.d3{animation-delay:0s;animation-name:s3}@keyframes s3{0%,21.82%{opacity:0}22.32%,96%{opacity:1}100%{opacity:0}}.d4{animation-delay:0s;animation-name:s4}@keyframes s4{0%,21.82%{opacity:0}22.32%,96%{opacity:1}100%{opacity:0}}.d5{animation-delay:0s;animation-name:s5}@keyframes s5{0%,21.82%{opacity:0}22.32%,96%{opacity:1}100%{opacity:0}}.d6{animation-delay:0s;animation-name:s6}@keyframes s6{0%,32.73%{opacity:0}33.23%,96%{opacity:1}100%{opacity:0}}.d7{animation-delay:0s;animation-name:s7}@keyframes s7{0%,32.73%{opacity:0}33.23%,96%{opacity:1}100%{opacity:0}}.d8{animation-delay:0s;animation-name:s8}@keyframes s8{0%,41.82%{opacity:0}42.32%,96%{opacity:1}100%{opacity:0}}.d9{animation-delay:0s;animation-name:s9}@keyframes s9{0%,41.82%{opacity:0}42.32%,96%{opacity:1}100%{opacity:0}}.d10{animation-delay:0s;animation-name:s10}@keyframes s10{0%,47.27%{opacity:0}47.77%,96%{opacity:1}100%{opacity:0}}.d11{animation-delay:0s;animation-name:s11}@keyframes s11{0%,54.55%{opacity:0}55.05%,96%{opacity:1}100%{opacity:0}}.d12{animation-delay:0s;animation-name:s12}@keyframes s12{0%,54.55%{opacity:0}55.05%,96%{opacity:1}100%{opacity:0}}</style>
<rect width="860" height="348" rx="10" fill="#0d1117"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text class="l d0" x="18" y="58" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3" font-weight="bold">bite --demo</tspan></text>
<text class="l d1" x="18" y="80" xml:space="preserve"><tspan fill="#8b949e">Two of its commits say they fixed something. One added a test for its fix, the other didn&#x27;t.</tspan></text>
<text class="l d2" x="18" y="102" xml:space="preserve"><tspan fill="#8b949e">Bite takes each fix back out and runs the tests, to see whether any test notices it&#x27;s gone.</tspan></text>
<text class="l d3" x="18" y="124" xml:space="preserve"><tspan fill="#e6edf3"></tspan></text>
<text class="l d4" x="18" y="146" xml:space="preserve"><tspan fill="#8b949e">  9661edcf </tspan><tspan fill="#7ee787" font-weight="bold">✅ noticed by test_discount_never_below_zero</tspan></text>
<text class="l d5" x="18" y="168" xml:space="preserve"><tspan fill="#e6edf3">           Fix discounts over 100% making the price negative</tspan></text>
<text class="l d6" x="18" y="190" xml:space="preserve"><tspan fill="#8b949e">  e5c329ec </tspan><tspan fill="#e3b341" font-weight="bold">⚠️ NO TEST NOTICED</tspan></text>
<text class="l d7" x="18" y="212" xml:space="preserve"><tspan fill="#e6edf3">           Fix totals showing long decimals like 0.30000000000000004</tspan></text>
<text class="l d8" x="18" y="234" xml:space="preserve"><tspan fill="#e6edf3"></tspan></text>
<text class="l d9" x="18" y="256" xml:space="preserve"><tspan fill="#e3b341">No test noticed it was gone. If it breaks later, nothing warns you.</tspan></text>
<text class="l d10" x="18" y="278" xml:space="preserve"><tspan fill="#e6edf3" font-weight="bold">Next: add a test that fails without it.</tspan></text>
<text class="l d11" x="18" y="300" xml:space="preserve"><tspan fill="#e6edf3"></tspan></text>
<text class="l d12" x="18" y="322" xml:space="preserve"><tspan fill="#8b949e">0s, $0.00</tspan></text>
</svg>
