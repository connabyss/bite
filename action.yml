name: Bite free check
description: Takes each pull request commit back out and runs your tests. Fails with NO TEST NOTICED when no test catches it.
branding:
  icon: check-circle
  color: green

inputs:
  args:
    description: Extra options for bite (see bite --help), e.g. --serious.
    default: ""
  max-commits:
    description: Check at most this many of the pull request's commits (each one runs the tests at least twice).
    default: "20"
  fail-on-gap:
    description: Fail the check when a commit's change is not guarded by any test.
    default: "true"
  comment:
    description: Post one comment on the pull request with the result per commit, and update it on later pushes.
    default: "true"
  write-tests:
    description: For each change no test noticed, have an AI write the missing test and show it in the comment, ready to paste in. Bite keeps it only if it passes with the change and fails without it. Needs anthropic-api-key; spending is capped by --budget in args ($1 by default).
    default: "false"
  anthropic-api-key:
    description: Your own Anthropic API key, for write-tests only. Pass your repository secret ANTHROPIC_API_KEY here. Pull requests from forks don't get secrets, so there Bite runs the free check only.
    default: ""
  open-pr:
    description: With write-tests, open a pull request into this pull request's branch that adds the tests Bite wrote, so adding them is one click on Merge. Uses the workflow's own token, which needs contents and pull-requests write permission, and the repository setting that lets GitHub Actions create pull requests. Not on pull requests from forks.
    default: "false"
  badge-branch:
    description: "On a push (say to main): check the newest commits (up to max-commits) and keep the Bite score on this branch as badge.json, for a README badge that follows it. Bite makes the branch and puts only badge.json there. Needs contents: write. Off when empty."
    default: ""
  github-token:
    description: Token for the comment (needs pull-requests write permission).
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install Bite
      shell: bash
      run: pipx install "$GITHUB_ACTION_PATH"
    - name: Run the free check on this pull request's commits
      id: bite
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        MAX: ${{ inputs.max-commits }}
        ARGS: ${{ inputs.args }}
        FAIL: ${{ inputs.fail-on-gap }}
        COMMENT: ${{ inputs.comment }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        WRITE: ${{ inputs.write-tests }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPEN_PR: ${{ inputs.open-pr }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BADGE_BRANCH: ${{ inputs.badge-branch }}
      run: |
        post_comment() {
          [ "$COMMENT" = "true" ] || return 0
          body=bite_proof/COMMENT.md  # bite writes it on every run that ends normally
          [ -f "$body" ] || return 0
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- bite-check -->")) | .id' | tail -n 1) &&
          # A new token can't always edit the last comment (say it was posted by another bot): then post a fresh one, and update that one from then on (the newest).
          if [ -n "$id" ] && gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" > /dev/null; then
            :
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$body" > /dev/null
          fi || echo "::warning::Bite couldn't post its comment (it needs pull-requests: write; pull requests from forks get a read-only token)."
        }
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "Bite needs the full history: set fetch-depth: 0 on actions/checkout."
          exit 1
        fi
        if [ -z "$BASE" ] && [ -n "$BADGE_BRANCH" ]; then
          # Not a pull request: the badge run. Check the newest commits and keep the score on the badge branch.
          rm -f bite_proof/badge.json bite_proof/FREE_REPORT.md
          bite --free --last "$MAX" --free-checks "$MAX" $ARGS || echo "::warning::Bite stopped early, so the badge stays as it was."
          if [ -f bite_proof/FREE_REPORT.md ]; then cat bite_proof/FREE_REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
          python3 "$GITHUB_ACTION_PATH/publish_badge.py"
          exit 0
        fi
        if [ -z "$BASE" ]; then
          echo "Bite's check runs on pull requests (on: pull_request), or on a push with badge-branch set."
          exit 1
        fi
        n=$(git rev-list --count --no-merges "$BASE..HEAD")
        export BITE_PR_COMMITS=$n  # so the comment can say when only the newest ones were checked
        [ "$n" -gt "$MAX" ] && n=$MAX
        export BITE_CHECKED_COMMITS=$n
        echo "This pull request has $n commit(s) to check."
        rm -f bite_proof/FREE_REPORT.md bite_proof/COMMENT.md
        rm -rf bite_proof/missing_tests
        if [ "$WRITE" = "true" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
          pipx inject bite-check claude-agent-sdk > /dev/null  # the writing step's package
          ARGS="$ARGS --write-tests"
        elif [ "$WRITE" = "true" ]; then
          echo "::warning::Bite: write-tests is on but there's no anthropic-api-key (pull requests from forks don't get secrets), so this run is the free check only."
        fi
        rc=0
        bite --free --since "$BASE" --last "$n" --free-checks "$n" $ARGS || rc=$?
        if [ "$rc" -ne 0 ]; then
          post_comment  # says why Bite couldn't run, so last push's comment doesn't stay up
          exit "$rc"
        fi
        if [ -d bite_proof/missing_tests ]; then
          echo "tests=true" >> "${GITHUB_OUTPUT:-/dev/null}"  # the next step offers them as a download
          if [ "$OPEN_PR" = "true" ]; then
            python3 "$GITHUB_ACTION_PATH/open_pr.py" || echo "::warning::Bite couldn't open the pull request with its tests."
          fi
        fi
        post_comment
        # Tests failing on the newest commit mean nothing was checked: the check goes red, like the comment.
        if [ "$FAIL" = "true" ] && grep -q '^### .*❌' bite_proof/COMMENT.md 2>/dev/null; then
          echo "::error::Bite: your tests fail on this pull request's newest commit, so Bite couldn't check it (its comment says why)."
          exit 1
        fi
        if [ -f bite_proof/FREE_REPORT.md ]; then
          cat bite_proof/FREE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAIL" = "true" ]; then
            echo "::error::Bite: a change in this pull request isn't guarded by any test (details in the job summary)."
            exit 1
          fi
        else
          echo "Bite: no change in this pull request is missing a test." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Offer the tests Bite wrote as a download
      if: always() && steps.bite.outputs.tests == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: bite-missing-tests
        path: bite_proof/missing_tests/
